<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DanielX-BTC | Crypto Exchange</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111f;
      color: white;
    }

    header {
      background: #0b1b2e;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #20344d;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f7931a, #ffb347);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
      font-size: 14px;
    }

    .hero {
      text-align: center;
      padding: 65px 20px 45px;
      background:
        radial-gradient(circle at top, #163b61 0%, #07111f 60%);
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #f7a623;
    }

    .hero p {
      color: #b7c4d4;
      max-width: 650px;
      margin: auto;
      line-height: 1.6;
      font-size: 17px;
    }

    .buttons {
      margin-top: 28px;
    }

    .btn {
      display: inline-block;
      padding: 14px 25px;
      margin: 6px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .primary {
      background: #f7a623;
      color: #07111f;
    }

    .secondary {
      background: #16283d;
      color: white;
      border: 1px solid #31506d;
    }

    section {
      padding: 45px 20px;
      max-width: 1100px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .section-title h2 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .section-title p {
      color: #91a4b9;
    }

    .coins {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .coin-card {
      background: #0d1d30;
      border: 1px solid #223b55;
      border-radius: 15px;
      padding: 25px;
      transition: 0.3s;
    }

    .coin-card:hover {
      transform: translateY(-5px);
      border-color: #f7a623;
    }

    .coin-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .coin-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
    }

    .btc {
      background: #f7931a;
    }

    .xrp {
      background: #111c29;
      border: 1px solid #52677e;
    }

    .sol {
      background: linear-gradient(135deg, #9945ff, #14f195);
    }

    .coin-name {
      font-size: 20px;
      font-weight: bold;
    }

    .coin-symbol {
      color: #91a4b9;
      font-size: 13px;
      margin-top: 3px;
    }

    .price {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .change {
      color: #20d58a;
      margin-bottom: 20px;
    }

    .trade-buttons {
      display: flex;
      gap: 10px;
    }

    .trade-buttons button {
      flex: 1;
      padding: 11px;
      border-radius: 7px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .buy {
      background: #18c77d;
      color: white;
    }
