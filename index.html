<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DanielX-BTC</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111936;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 80px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #b8c0d9;
      font-size: 18px;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 28px;
      background: #f5b400;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .cards {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      padding: 30px 20px 70px;
    }

    .card {
      background: #151d3b;
      padding: 25px;
      width: 220px;
      border-radius: 12px;
      text-align: center;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #111936;
      color: #8992ad;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">DanielX-BTC</div>
  </header>

  <section class="hero">
    <h1>Welcome to DanielX-BTC</h1>
    <p>Simple and modern digital asset platform.</p>
    <a href="#" class="button">Get Started</a>
  </section>

  <section class="cards">

    <div class="card">
      <h2>₿ Bitcoin</h2>
      <p>BTC</p>
      <div class="price">BTC</div>
    </div>

    <div class="card">
      <h2>◆ XRP</h2>
      <p>XRP</p>
      <div class="price">XRP</div>
    </div>

    <div class="card">
      <h2>◎ Solana</h2>
      <p>SOL</p>
      <div class="price">SOL</div>
    </div>

  </section>

  <footer>
    © 2026 DanielX-BTC. All rights reserved.
  </footer>

</body>
</html>
