<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DanielX-BTC</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111f;
      color: white;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1728;
      border-bottom: 1px solid #1d3048;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #00d4ff;
    }

    .hero {
      text-align: center;
      padding: 70px 20px;
      background: linear-gradient(135deg, #07111f, #102b46);
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #b7c7d9;
      margin-bottom: 30px;
      font-size: 17px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 22px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .market-btn {
      background: #00d4ff;
      color: #00111a;
    }

    #market {
      display: none;
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
    }

    #market h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 30px;
    }

    .coin {
      background: #0d1d31;
      border: 1px solid #1d3855;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .coin-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .coin-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #152c44;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .coin-name {
      font-size: 18px;
      font-weight: bold;
    }

    .coin-symbol {
      color: #8da5bd;
      font-size: 13px;
      margin-top: 4px;
    }

    .price {
      font-weight: bold;
      color: #00d4ff;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .buy {
      background: #16c784;
      color: white;
    }

    .sell {
      background: #ea3943;
      color: white;
    }

    .notice {
      text-align: center;
      color: #8da5bd;
      margin-top: 25px;
      font-size: 13px;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      color: #71859a;
      border-top: 1px solid #1d3048;
      margin-top: 40px;
    }

    @media (max-width: 650px) {
      .hero h1 {
        font-size: 32px;
      }

      .coin {
        flex-direction: column;
        align-items: flex-start;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">DanielX-<span>BTC</span></div>
  </header>

  <section class="hero">
    <h1>Welcome to DanielX-BTC</h1>
    <p>Explore digital assets and view the cryptocurrency market.</p>

    <button class="market-btn" onclick="showMarket()">
      View Market
    </button>
  </section>

  <section id="market">

    <h2>Crypto Market</h2>

    <div class="coin">
      <div class="coin-info">
        <div class="coin-icon">₿</div>
        <div>
          <div class="coin-name">Bitcoin</div>
          <div class="coin-symbol">BTC</div>
        </div>
      </div>

      <div class="price">$--</div>

      <div class="actions">
        <button class="buy" onclick="buyCoin('Bitcoin')">Buy</button>
        <button class="sell" onclick="sellCoin('Bitcoin')">Sell</button>
      </div>
    </div>

    <div class="coin">
      <div class="coin-info">
        <div class="coin-icon">XRP</div>
        <div>
          <div class="coin-name">XRP</div>
          <div class="coin-symbol">XRP</div>
        </div>
      </div>

      <div class="price">$--</div>

      <div class="actions">
        <button class="buy" onclick="buyCoin('XRP')">Buy</button>
        <button class="sell" onclick="sellCoin('XRP')">Sell</button>
      </div>
    </div>

    <div class="coin">
      <div class="coin-info">
        <div class="coin-icon">SOL</div>
        <div>
          <div class="coin-name">Solana</div>
          <div class="coin-symbol">SOL</div>
        </div>
      </div>

      <div class="price">$--</div>

      <div class="actions">
        <button class="buy" onclick="buyCoin('Solana')">Buy</button>
        <button class="sell" onclick="sellCoin('Solana')">Sell</button>
      </div>
    </div>

    <p class="notice">
      Market prices will be connected to a live price service later.
    </p>

  </section>

  <footer>
    © 2026 DanielX-BTC. All rights reserved.
  </footer>

  <script>
    function showMarket() {
      document.getElementById("market").style.display = "block";

      document.getElementById("market").scrollIntoView({
        behavior: "smooth"
      });
    }

    function buyCoin(coin) {
      alert("Buy " + coin + " — trading feature coming soon.");
    }

    function sellCoin(coin) {
      alert("Sell " + coin + " — trading feature coming soon.");
    }
  </script>

</body>
</html>
