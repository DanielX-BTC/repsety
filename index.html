<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #07111f;
  color: white;
}

header {
  background: #0b1728;
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #1d314a;
}

.logo {
  font-size: 23px;
  font-weight: bold;
}

.logo span {
  color: #f5b800;
}

nav button {
  background: none;
  border: none;
  color: white;
  margin-left: 10px;
  cursor: pointer;
  font-size: 14px;
}

.hero {
  padding: 55px 20px;
  text-align: center;
  background: linear-gradient(135deg,#07111f,#102846);
}

.hero h1 {

  margin-bottom: 15px;
}

.hero p {

}

.btn {

  color: #07111f;
  border: none;
  padding: 13px 22px;
  border-radius: 7px;
  font-weight: bold;
  cursor: pointer;
}

section {
  padding: 35px 20px;
  max-width: 1100px;
  margin: auto;
}

h2 {
  margin-bottom: 20px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
  gap: 15px;
}

.card {
  background: #0d1b2e;
  padding: 20px;
  border-radius: 10px;
  border: 1px solid #1d314a;
}

.coin {
  font-size: 20px;
  font-weight: bold;
}

.price {
  margin-top: 12px;
  font-size: 22px;
}

.green {
  color: #20d47b;
}

.trading {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.panel {
  background: #0d1b2e;
  padding: 20px;
  border-radius: 10px;
  border: 1px solid #1d314a;
}

input, select {
  width: 100%;
  padding: 13px;
  margin: 8px 0 15px;
  background: #07111f;
  color: white;
  border: 1px solid #314761;
  border-radius: 6px;
}

.form-box {
  max-width: 430px;
  margin: 20px auto;
  background: #0d1b2e;
  padding: 25px;
  border-radius: 12px;
}

.hidden {
  display: none;
}
