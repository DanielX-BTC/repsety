<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DanielX-BTC</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #07111f;
      color: white;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 20px;
      background: #0b1728;
      border-bottom: 1px solid #1d3048;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #20d6ff;
    }

    .menu {
      color: #aebdce;
    }

    .hero {
      text-align: center;
      padding: 65px 20px 35px;
    }

    .hero h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .hero h1 span {
      color: #20d6ff;
    }

    .hero p {
      color: #aebdce;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .create-btn {
      border: none;
      background: #20d6ff;
      color: #03101b;
      padding: 16px 32px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .create-btn:hover {
      opacity: 0.9;
    }

    .markets {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 20px;
    }

    .coin {
      min-width: 120px;
      background: #0d1c30;
      border: 1px solid #1c334e;
      padding: 16px;
      border-radius: 12px;
    }

    .coin strong {
      display: block;
      margin-bottom: 8px;
    }

    .coin small {
      color: #8fa4ba;
    }

    #accountPage {
      display: none;
      padding: 30px 20px;
    }

    .account-box {
      max-width: 450px;
      margin: auto;
      background: #0d1c30;
      padding: 25px;
      border-radius: 16px;
      border: 1px solid #203951;
    }

    .account-box h2 {
      margin-bottom: 10px;
      color: #20d6ff;
    }

    .account-box p {
      color: #9fb0c3;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 9px;
      border: 1px solid #30465f;
      background: #07111f;
      color: white;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      background: #20d6ff;
      border: none;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .back-btn {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      background: transparent;
      border: 1px solid #30465f;
      color: white;
      border-radius: 9px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 35px 20px;
      color: #70849a;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">DanielX-BTC</div>
    <div class="menu">Crypto Exchange</div>
  </header>

  <main id="homePage">

    <section class="hero">
      <h1>Welcome to <span>DanielX-BTC</span></h1>

      <p>
        Buy, sell and manage digital assets from one simple platform.
      </p>

      <button class="create-btn" onclick="showAccount()">
        Create Account
      </button>
    </section>

    <section class="markets">

      <div class="coin">
        <strong>₿ BTC</strong>
        <small>Bitcoin</small>
      </div>

      <div class="coin">
        <strong>✕ XRP</strong>
        <small>XRP</small>
      </div>

      <div class="coin">
        <strong>◎ SOL</strong>
        <small>Solana</small>
      </div>

    </section>

  </main>

  <section id="accountPage">

    <div class="account-box">

      <h2>Create Your Account</h2>

      <p>
        Enter your details to continue.
      </p>

      <form onsubmit="createAccount(event)">

        <input
          type="text"
          id="name"
          placeholder="Full Name"
          required
        >

        <input
          type="email"
          id="email"
          placeholder="Email Address"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Create Password"
          required
        >

        <button class="submit-btn" type="submit">
          Create Account
        </button>

      </form>

      <button class="back-btn" onclick="goBack()">
        ← Back
      </button>

    </div>

  </section>

  <footer>
    © 2026 DanielX-BTC
  </footer>

  <script>

    function showAccount() {
      document.getElementById("homePage").style.display = "none";
      document.getElementById("accountPage").style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function goBack() {
      document.getElementById("accountPage").style.display = "none";
      document.getElementById("homePage").style.display = "block";
    }

    function createAccount(event) {
      event.preventDefault();

      alert(
        "Account form submitted. A real account system must be connected to a secure backend before storing user information."
      );
    }

  </script>

</body>
</html>
