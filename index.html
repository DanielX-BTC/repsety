<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DanielX-BTC</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: white;
    }

    header {
      display: flex;
      align-items: center;
      padding: 18px 22px;
      background: #0d1b2e;
      border-bottom: 1px solid #26364d;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f5b400;
      color: #07111f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 75px 20px;
    }

    .hero h1 {
      font-size: 42px;
      margin: 15px 0;
    }

    .hero p {
      color: #aebbd0;
      font-size: 18px;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 14px 30px;
      background: #f5b400;
      color: #07111f;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      padding: 20px;
    }

    .card {
  background: rgba(16, 34, 56, 0.85);
  padding: 25px;
  width: 250px;
  border-radius: 16px;
  text-align: center;
  border: 1px solid #344b68;
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}
    }

    .coin {
      font-size: 38px;
    }

    footer {
      margin-top: 60px;
      padding: 25px;
      text-align: center;
      background: #0d1b2e;
      color: #8795aa;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      <div class="logo-icon">₿</div>
      DanielX-BTC
    </div>
  </header>

  <section class="hero">
    <h1>Welcome to DanielX-BTC</h1>
    <p>Your digital asset platform.</p>
    <a href="#" class="button">Get Started</a>
  </section>

  <section class="cards">

    <div class="card">
      <div class="coin">₿</div>
      <h2>Bitcoin</h2>
      <p>BTC</p>
    </div>

    <div class="card">
      <div class="coin">◆</div>
      <h2>XRP</h2>
      <p>XRP</p>
    </div>

    <div class="card">
      <div class="coin">◎</div>
      <h2>Solana</h2>
      <p>SOL</p>
    </div>

  </section>

  <footer>
    © 2026 DanielX-BTC
  </footer>

</body>
</html>
